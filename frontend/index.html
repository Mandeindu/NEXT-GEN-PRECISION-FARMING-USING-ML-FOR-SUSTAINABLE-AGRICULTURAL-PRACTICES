<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Gen Precision Farming | TabNet AI</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1><i class="fa-solid fa-leaf"></i> NEXT GEN PRECISION FARMING </h1>
            <p>Smart Crop Recommendation System Powered by TabNet Deep Learning</p>
        </header>

        <main>
            <section class="form-section">
                <h2><i class="fa-solid fa-sliders"></i> Soil & Environment Params</h2>
                <form id="predictionForm">
                    <div class="form-grid">
                        <div class="input-group">
                            <label><i class="fa-solid fa-droplet" style="color:#3b82f6;"></i> Nitrogen (N)</label>
                            <input type="number" name="nitrogen" required placeholder="e.g. 90">
                        </div>
                        <div class="input-group">
                            <label><i class="fa-solid fa-flask" style="color:#8b5cf6;"></i> Phosphorus (P)</label>
                            <input type="number" name="phosphorus" required placeholder="e.g. 40">
                        </div>
                        <div class="input-group">
                            <label><i class="fa-solid fa-cubes" style="color:#f59e0b;"></i> Potassium (K)</label>
                            <input type="number" name="potassium" required placeholder="e.g. 40">
                        </div>
                        <div class="input-group">
                            <label><i class="fa-solid fa-vial" style="color:#ef4444;"></i> Soil pH</label>
                            <input type="number" step="0.1" name="ph" required placeholder="e.g. 6.5">
                        </div>
                        <div class="input-group">
                            <label><i class="fa-solid fa-water" style="color:#0ea5e9;"></i> Soil Moisture</label>
                            <input type="number" step="0.1" name="soil_moisture" required placeholder="e.g. 50">
                        </div>
                        <div class="input-group">
                            <label><i class="fa-solid fa-mound" style="color:#a8a29e;"></i> Soil Type</label>
                            <select name="soil_type">
                                <option value="Black">Black</option>
                                <option value="Red">Red</option>
                                <option value="Loamy">Loamy</option>
                                <option value="Clay">Clay</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label><i class="fa-solid fa-cloud-sun" style="color:#fbbf24;"></i> Season</label>
                            <select name="season">
                                <option value="Kharif">Kharif</option>
                                <option value="Rabi">Rabi</option>
                                <option value="Zaid">Zaid</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label><i class="fa-solid fa-location-dot" style="color:#ef4444;"></i> Location</label>
                            <select name="location">
                                <option value="Pune">Pune</option>
                                <option value="Mumbai">Mumbai</option>
                                <option value="Delhi">Delhi</option>
                                <option value="Bangalore">Bangalore</option>
                                <option value="Chennai">Chennai</option>
                                <option value="Kolkata">Kolkata</option>
                                <option value="Hyderabad">Hyderabad</option>
                                <option value="Nagpur">Nagpur</option>
                                <option value="Nashik">Nashik</option>
                                <option value="Ahmedabad">Ahmedabad</option>
                            </select>
                        </div>

                        <div class="input-group full-width checkbox-group">
                            <input type="checkbox" id="manualWeatherCheck">
                            <label for="manualWeatherCheck">Override Live Weather Manually</label>
                        </div>

                        <div id="manualWeatherFields" class="form-grid full-width"
                            style="display: none; margin-top: 10px;">
                            <div class="input-group">
                                <label>Temperature (°C)</label>
                                <input type="number" step="0.1" name="manual_temp" placeholder="e.g. 28">
                            </div>
                            <div class="input-group">
                                <label>Humidity (%)</label>
                                <input type="number" step="0.1" name="manual_humidity" placeholder="e.g. 70">
                            </div>
                            <div class="input-group full-width">
                                <label>Rainfall (mm) [Optional]</label>
                                <input type="number" step="0.1" name="manual_rainfall" placeholder="e.g. 100">
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn">
                        <span class="loader" id="btnLoader"></span>
                        <span id="btnText"><i class="fa-solid fa-microchip"></i> Run AI Analysis</span>
                    </button>
                </form>
            </section>

            <section class="result-section" id="resultSection" style="display: none;">
                <h2><i class="fa-solid fa-chart-pie"></i> Analysis Result</h2>
                <div class="card">
                    <p
                        style="text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; color: #94a3b8; margin-bottom: 5px;">
                        Optimal Crop</p>
                    <h3 id="cropName">--</h3>
                    <p class="confidence" id="confidenceScore">Confidence: --</p>

                    <div class="weather-info">
                        <div class="weather-item">
                            <i class="fa-solid fa-temperature-half"></i>
                            <span class="val" id="weatherTemp">--</span>
                            <span class="label">Temp °C</span>
                        </div>
                        <div class="weather-item">
                            <i class="fa-solid fa-droplet"></i>
                            <span class="val" id="weatherHum">--</span>
                            <span class="label">Humidity %</span>
                        </div>
                        <div class="weather-item">
                            <i class="fa-solid fa-cloud-rain"></i>
                            <span class="val" id="weatherRain">--</span>
                            <span class="label">Rain mm</span>
                        </div>
                    </div>

                    <p class="explanation" id="explanationText">--</p>
                </div>
            </section>
        </main>
    </div>

    <script>
        document.getElementById('manualWeatherCheck').addEventListener('change', function () {
            const fields = document.getElementById('manualWeatherFields');
            if (this.checked) {
                fields.style.display = 'grid'; // changed to grid to match form-grid layout
                document.querySelector('[name="manual_temp"]').required = true;
                document.querySelector('[name="manual_humidity"]').required = true;
            } else {
                fields.style.display = 'none';
                document.querySelector('[name="manual_temp"]').required = false;
                document.querySelector('[name="manual_humidity"]').required = false;
            }
        });

        document.getElementById('predictionForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const formData = new FormData(this);
            const resultSection = document.getElementById('resultSection');
            const btn = document.querySelector('.btn');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');

            // Setup loading state
            btnText.style.display = 'none';
            btnLoader.style.display = 'inline-block';
            btn.disabled = true;

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.error) {
                    alert('Error: ' + data.error);
                } else {
                    document.getElementById('cropName').innerText = data.crop;
                    document.getElementById('confidenceScore').innerText = "Confidence: " + data.confidence;
                    document.getElementById('weatherTemp').innerText = data.weather.temp;
                    document.getElementById('weatherHum').innerText = data.weather.humidity;

                    // Display rainfall formatted
                    if (data.weather.rainfall !== undefined) {
                        document.getElementById('weatherRain').innerText = parseFloat(data.weather.rainfall).toFixed(1);
                    } else {
                        document.getElementById('weatherRain').innerText = "0.0";
                    }

                    document.getElementById('explanationText').innerText = data.explanation;

                    resultSection.style.display = 'flex';
                    resultSection.classList.remove('fade-in');
                    // Trigger reflow to restart animation
                    void resultSection.offsetWidth;
                    resultSection.classList.add('fade-in');

                    if (window.innerWidth < 860) {
                        resultSection.scrollIntoView({ behavior: "smooth" });
                    }
                }
            } catch (err) {
                console.error(err);
                alert('An error occurred while connecting to the AI engine.');
            }

            // Reset loading state
            btnText.style.display = 'inline-block';
            btnLoader.style.display = 'none';
            btn.disabled = false;
        });
    </script>
</body>

</html>
